name: recall
description: "Recall - 自动整理 · 高质量回看 · 主题串联（移动端 iOS / Android）"
publish_to: 'none'
version: 1.0.8+8

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 路由
  go_router: ^12.1.3

  # 状态管理
  flutter_riverpod: ^2.4.9

  # 存储
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # 网络
  dio: ^5.4.0

  # CloudBase（调用 Event 类型云函数，与 web 端 SDK 对齐）
  cloudbase_flutter: ^1.1.0

  # 工具
  intl: ^0.19.0
  uuid: ^4.2.1
  collection: ^1.18.0

  # Markdown 渲染
  flutter_markdown: ^0.6.18

  # 字体（运行时拉取 Noto Serif SC，对齐 web 端编辑级衬线风格）
  google_fonts: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
